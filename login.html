<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MediCare+ | Login</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:
        ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,
        300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <link rel="stylesheet" href="styles/login.css">    
    </head>
    <body>
        <div class="container">
            <div class="tabs">
                <div class="tab active" id="login-tab">Login</div>
                <div class="tab" id="signup-tab">Sign Up</div>
            </div>

             <!-- Login Form -->
            <form action="php/login.php" method="POST" id="login-form" class="active">
                <h2>Login</h2>
                <input type="text" name="username" id="login-username" placeholder="Username" required>
                <input type="password" name="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <!-- Signup Form -->
            <form action="php/signup.php" method="POST" id="signup-form" onsubmit="return validateForm()">
                <h2>Sign Up</h2>
                <input type="text" name="username" id="signup-username" placeholder="Username" required>

                <input type="email" name="email" id="signup-email" placeholder="Email" 
                    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                    title="Please enter a valid email address (e.g. user@example.com)"
                    required>

    
                <input type="password" name="password" id="signup-password" 
                    placeholder="Password" minlength="8"
                    title="Password must be at least 8 characters long" required>

    
                <input type="password" id="signup-confirm" placeholder="Confirm Password" minlength="8" required>
                <button type="submit">Create Account</button>
            </form>

            <a href="homepage.html" class="back-home">← Back to Home</a>
        </div>
        <script src="script/login.js"></script>    
    </body>
</html>
